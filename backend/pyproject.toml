[project]
name = "testscope-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

# 의존성 정본은 requirements.txt 다. 폐쇄망 배포가 `pip wheel -r requirements.txt`
# 로 wheel 번들을 만들고 서버는 --no-index 로 설치하므로, 전이 의존성까지 고정된
# 파일이 하나 있어야 한다.

[tool.ruff]
line-length = 95
target-version = "py313"
src = [".", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의 의존성 주입은 기본값 자리에 Depends() 를 쓰는 것이 정식 문법이라
# B008(기본 인자에서 함수 호출)이 전부 오탐이 된다.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.File",
  "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Alembic 이 생성한 파일은 손대지 않는 한 그대로 둔다. 여기를 린트에 맞추려고
# 생성 결과를 매번 손보면, 정작 사람이 쓴 부분의 변경이 묻힌다.
"migrations/versions/*" = ["E501", "I001", "UP035", "UP007"]
# 비교키 정규화는 **전각·유사 문자 자체가 소재**다. 그것을 "오타 아니냐" 고 묻는
# 검사와는 맞지 않는다 — 여기서는 그 문자가 정답이다.
"app/shared/text.py" = ["RUF002"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
