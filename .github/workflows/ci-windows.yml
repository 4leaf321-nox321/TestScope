# 검증 게이트.
#
# **Windows 를 쓴다.** 여기가 배포 대상이고, 이 CI 가 잡는 것들(러너 콘솔이 한글을
# 못 찍어 죽는 스크립트, BOM 없는 .ps1, PowerShell 5.1 의 stderr 처리)은 리눅스에서는
# 원리상 안 드러난다.
#
# **줄을 둘로 나눴다.** 백엔드와 프론트는 서로를 안 기다린다 — 벽시계는 긴 줄 하나로
# 줄고, 어디서 깨졌는지도 목록에서 바로 보인다.

name: CI - Windows

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # 러너 콘솔이 cp1252 라 스크립트가 한글을 찍는 순간 UnicodeEncodeError 로 죽는다.
  # 한국어 서버(CP949)에서는 안 나므로 여기서만 드러난다.
  PYTHONIOENCODING: utf-8

jobs:
  backend:
    name: 백엔드 (ruff · mypy · pytest · alembic)
    runs-on: windows-latest
    env:
      # conftest 가 여기서 <이름>_test 를 파생해 만든다. **개발 DB 를 건드리지 않는**
      # 구조가 CI 에서도 그대로 성립한다.
      DATABASE_URL: postgresql+psycopg://postgres:root@localhost:5432/testscope
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          # 매 실행 pip 가 휠을 다시 받지 않게. 잠금이 안 바뀌면 그대로 쓴다.
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            mcp_server/requirements.txt

      # windows 러너 이미지에는 PostgreSQL 이 설치돼 있지만 꺼져 있다.
      - name: PostgreSQL 시작
        shell: pwsh
        run: |
          $service = Get-Service -Name postgresql* | Select-Object -First 1
          Set-Service -InputObject $service -StartupType Automatic
          Start-Service -InputObject $service
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN\pg_isready" --timeout=30

      - name: 백엔드 의존성
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 린트 (ruff)
        working-directory: backend
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: 타입 (mypy strict)
        working-directory: backend
        run: python -m mypy

      - name: 테스트 (pytest)
        working-directory: backend
        shell: pwsh
        run: |
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN\createdb" -U postgres -h localhost testscope_test
          python -m pytest

      # **마이그레이션이 모델과 어긋났는지 본다.** 시험은 모델로 표를 만들기 때문에
      # 그 어긋남을 못 잡는다 — 그리고 그것은 배포하고 나서야 500 으로 드러난다.
      - name: 마이그레이션 정합 (alembic check)
        working-directory: backend
        shell: pwsh
        run: |
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN\createdb" -U postgres -h localhost testscope
          python -m alembic upgrade head
          python -m alembic check

      # **MCP 도구를 진짜로 불러 본다.** curl 로는 멀쩡한데 도구로는 죽는 고장(반환 모양
      # 검증 · 경로 오타)은 이렇게 불러 봐야만 드러난다 — 도구가 41개일 때 넷이 죽어 있던
      # 것이 그 예다. 정적 검사(test_mcp_tools.py)는 그것을 못 잡는다.
      #
      # 위 단계가 만들어 둔 testscope DB(마이그레이션 끝)에 설치 시드를 심고, 백엔드를
      # reload 없이 띄우고(reload 워커는 부모를 죽여도 소켓을 물고 남는다), 확인용 계정의
      # 토큰으로 읽기 묶음과 쓰기 사슬을 돈다. 만든 것은 끝에 지운다 — 러너는 버려지지만
      # 같은 스크립트를 개발 PC 에서도 쓰기 때문이다.
      - name: MCP 왕복 (실제 도구 호출)
        working-directory: backend
        shell: pwsh
        env:
          APP_ENV: development
        run: |
          python scripts/seed_install.py --email ci-admin --password ci-password --name CI
          $token = (python scripts/mcp_probe_account.py mint | Select-Object -Last 1)

          python -m venv ..\mcp_server\.venv
          & ..\mcp_server\.venv\Scripts\python.exe -m pip install --quiet -r ..\mcp_server\requirements.txt

          $server = Start-Process -FilePath python -PassThru -NoNewWindow `
            -ArgumentList '-m','uvicorn','app.main:app','--host','127.0.0.1','--port','8021' `
            -RedirectStandardOutput ..\backend-ci.log -RedirectStandardError ..\backend-ci.err
          $deadline = (Get-Date).AddSeconds(90)
          $up = $false
          while (-not $up -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            try { $up = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8021/api/health).StatusCode -eq 200 } catch { $up = $false }
          }
          if (-not $up) { Get-Content ..\backend-ci.err; throw '백엔드가 90초 안에 안 떴습니다' }

          $env:TESTSCOPE_API_BASE = 'http://127.0.0.1:8021/api'
          $env:TESTSCOPE_PAT = $token
          & ..\mcp_server\.venv\Scripts\python.exe ..\mcp_server\roundtrip.py --write
          $code = $LASTEXITCODE
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          python scripts/mcp_probe_account.py cleanup
          if ($code -ne 0) { Get-Content ..\backend-ci.err -Tail 40; throw "MCP 왕복 실패 (exit $code)" }

  frontend:
    name: 프론트 (빌드 · vitest · oxlint · 생성 타입)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: 프론트엔드 의존성
        working-directory: frontend
        run: npm ci

      - name: 프론트엔드 빌드 (tsc strict + vite)
        working-directory: frontend
        run: npm run build

      - name: 프론트엔드 테스트 (vitest)
        working-directory: frontend
        run: npm test

      - name: 프론트엔드 린트 (oxlint)
        working-directory: frontend
        run: npm run lint

      # **서식도 검사한다.** 백엔드는 `ruff format --check` 로 보고 있었는데 프론트만
      # 안 봤다 — 그 사이에 세미콜론과 쌍따옴표가 섞여 들어왔다.
      - name: 프론트엔드 서식 (prettier)
        working-directory: frontend
        run: npm run format:check

      # **생성 타입이 커밋된 것과 다르면 누군가 재생성을 빠뜨린 것이다.** 손으로
      # 적은 타입은 반드시 서버와 어긋나고, 어긋난 날 화면은 아무 말도 안 하고
      # undefined 를 그린다.
      - name: 생성 타입 최신성
        shell: pwsh
        run: |
          cd backend
          python -m pip install -r requirements.txt
          python scripts/export_openapi.py
          cd ../frontend
          npm run api:types
          $diff = git diff --name-only -- src/shared/api/schema.d.ts ../backend/openapi.json
          if ($diff) {
            Write-Error "생성물이 최신이 아닙니다 ($diff). export_openapi.py 와 npm run api:types 를 돌리고 커밋하세요."
            exit 1
          }
